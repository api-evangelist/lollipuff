aid: lollipuff
name: Lollipuff
description: >-
  Lollipuff is a luxury goods authentication service that has been authenticating
  high-end designer apparel and accessories professionally since 2010. Led by CEO
  Fei Deyle, the company uses a patent-pending process combining human expert
  authenticators with software to determine the authenticity of pre-owned designer
  items from submitted photographs, issuing an online certificate with a unique,
  shareable URL that owners can post alongside listings on sites like eBay. Lollipuff
  (YC W13) originally operated as a peer-to-peer online auction marketplace that
  pre-screened every listing for authenticity; the marketplace closed in 2020 as
  payment-processor fee structures changed, and the company now focuses on its
  photo-based authentication and certificate-lookup service, which many consignment
  and resale businesses rely on for their most challenging authentications. It is a
  consumer-facing web service with no publicly documented developer API.
